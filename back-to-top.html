<button id="back-to-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
</button>
<script>
(function () {
  var btn = document.getElementById('back-to-top');
  function onScroll() {
    var scrolled = window.scrollY || document.documentElement.scrollTop;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    btn.classList.toggle('btt-visible', docHeight > 0 && scrolled / docHeight > 0.75);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
